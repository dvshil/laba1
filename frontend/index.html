<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лаба: Compose + KVM + Ansible</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --card: #ffffff;
      --text: #1b2230;
      --muted: #6b7587;
      --accent: #4f6bed;
      --accent-hover: #3b55d6;
      --border: #e2e6ee;
      --ok: #1f9d55;
      --err: #d64545;
      --code-bg: #f0f2f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --card: #1b202b;
        --text: #e8ecf4;
        --muted: #8b94a7;
        --accent: #6f86ff;
        --accent-hover: #8a9cff;
        --border: #2a3140;
        --code-bg: #141821;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--muted);
    }
    .dot.ok { background: var(--ok); }
    .dot.err { background: var(--err); }
    .message {
      font-size: 20px;
      font-weight: 600;
      padding: 16px;
      border-radius: 12px;
      background: var(--code-bg);
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .row span:first-child { color: var(--muted); }
    .row span:last-child { font-family: ui-monospace, Consolas, monospace; }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: wait; }
    details { margin-top: 20px; font-size: 13px; color: var(--muted); }
    pre {
      margin: 10px 0 0;
      padding: 12px;
      background: var(--code-bg);
      border-radius: 8px;
      overflow-x: auto;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Фронтенд работает</h1>
    <p class="sub">Docker Compose · KVM · Ansible</p>

    <div class="status"><span id="dot" class="dot"></span><span id="status">Ожидание запроса…</span></div>

    <div class="message" id="message">—</div>
    <div class="row"><span>Контейнер бэкенда</span><span id="hostname">—</span></div>
    <div class="row"><span>Время ответа</span><span id="time">—</span></div>

    <button id="btn">Спросить бэкенд</button>

    <details>
      <summary>Сырой ответ</summary>
      <pre id="raw">—</pre>
    </details>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    async function ask() {
      const btn = $('btn');
      btn.disabled = true;
      $('status').textContent = 'Запрос к бэкенду…';
      $('dot').className = 'dot';
      try {
        const r = await fetch('/api/hello');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        $('message').textContent = data.message;
        $('hostname').textContent = data.hostname;
        $('time').textContent = data.time.replace('T', ' ');
        $('raw').textContent = JSON.stringify(data, null, 2);
        $('status').textContent = 'Бэкенд отвечает';
        $('dot').className = 'dot ok';
      } catch (e) {
        $('message').textContent = 'Не удалось получить ответ';
        $('raw').textContent = String(e);
        $('status').textContent = 'Ошибка: ' + e.message;
        $('dot').className = 'dot err';
      } finally {
        btn.disabled = false;
      }
    }

    $('btn').addEventListener('click', ask);
    ask();
  </script>
</body>
</html>
